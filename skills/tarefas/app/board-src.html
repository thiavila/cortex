{{CSS_BASE}}
<style>
/* ===== v1: tags, ligações, plano do dia ===== */
.tagchip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: transparent; white-space: nowrap; cursor: pointer; }
.tagchip:hover, .tagchip.on { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.tagchip.pessoa::before { content: "@"; opacity: .6; }
.parent { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.chip.auto { background: transparent; border: 1px dotted var(--muted); }
.chip.desc { background: var(--surface-2); color: var(--muted); text-decoration: line-through; }
.today { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px 24px; }
.today h2 { margin: 0 0 6px; font-family: var(--f-display); font-size: 15px; font-weight: 600; }
.today ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.today li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; min-width: 0; }
.today li span { overflow-wrap: anywhere; min-width: 0; }
.today li.done span { color: var(--muted); text-decoration: line-through; }
.today input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); }
.today .hora { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 42px; }
[hidden] { display: none !important; }
.linkt, .today .linkt { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); }
.rel-list { display: flex; flex-direction: column; gap: 6px; }
.rel-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.rel-row button.go { border: 0; background: transparent; color: var(--fg); text-align: left; padding: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
.rel-row .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; flex: none; }
.rel-add { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; }
/* conversa do Claude Code (CLI): botão que copia o comando de retomada, com a cara do link de conversa */
button.conv { background: transparent; cursor: pointer; text-align: left; }
/* ===== recorrentes ===== */
.chip.rec { background: var(--info-soft); color: var(--info); }
.recs { display: flex; flex-direction: column; gap: 12px; }
.rec-form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; align-items: end; }
.rec-form .wide { grid-column: span 2; }
.rec-form .full { grid-column: 1 / -1; }
.rec-form h2 { grid-column: 1 / -1; margin: 0; font-family: var(--f-display); font-size: 15px; font-weight: 600; }
.dows { display: flex; flex-wrap: wrap; gap: 4px; }
.dows label { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; display: flex; gap: 4px; align-items: center; }
.rec-row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.rec-row.off { opacity: .6; }
.rec-row .t { font-weight: 600; flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
.rec-row .r { font-size: 12.5px; color: var(--muted); }
.togglebtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
@media (max-width: 640px) { .today { grid-template-columns: 1fr; } .rel-add { grid-template-columns: 1fr; } .rec-form { grid-template-columns: 1fr 1fr; } }
</style>
{{TEMA}}

<div class="wrap">
  <header class="top">
    <h1><span id="scopeName"></span><small id="scopeSub"></small></h1>
    <span class="sync" id="sync"><span class="dot"></span><span id="syncText"></span></span>
  </header>

  <div class="banner" id="banner" hidden></div>
  <section class="today" id="today" hidden data-i18n-aria="aria.hoje"></section>
  <div class="summary" id="summary" aria-live="polite"></div>

  <form class="quick" id="quickForm" autocomplete="off">
    <input class="field" id="quickInput" data-i18n-aria="quick.aria" data-i18n-ph="quick.ph">
    <button class="btn primary" type="submit" id="quickBtn" data-i18n="quick.btn"></button>
  </form>
  <div class="hint" id="quickHint"></div>

  <div class="toolbar">
    <div class="grow"><input class="field" id="q" type="search" data-i18n-aria="search.aria" data-i18n-ph="search.ph"></div>
    <div style="flex:0 1 190px;min-width:0"><select class="field" id="fProjeto" data-i18n-aria="f.projeto"></select></div>
    <div style="flex:0 1 190px;min-width:0"><select class="field" id="fTag" data-i18n-aria="f.tag"></select></div>
    <div class="seg" role="group" data-i18n-aria="f.area" id="fArea"></div>
    <div class="seg" role="group" data-i18n-aria="f.view" id="fView">
      <button type="button" data-v="quadro" data-i18n="view.quadro"></button>
      <button type="button" data-v="lista" data-i18n="view.lista"></button>
      <button type="button" data-v="recorrentes" data-i18n="view.rec"></button>
    </div>
    <button type="button" class="btn togglebtn" id="fRec" data-i18n="rec.toggle" data-i18n-title="rec.toggleTitle"></button>
  </div>

  <main id="main"></main>
</div>

<div id="drawerHost"></div>
<div class="toast" id="toast" hidden></div>

  const tk = byId(ui.openId); if (!tk) return;
  const go = e.target.closest("[data-open]"); if (go) { openTask(go.dataset.open); return; }
  const cp = e.target.closest("[data-copyconv]"); if (cp) { const c = (tk.conversas || [])[+cp.dataset.copyconv]; if (c) copyText(convLink(c)); return; }
  const rc = e.target.closest("[data-rmconv]"); if (rc) { patchTask(tk.id, { conversas: (tk.conversas || []).filter((_, i) => i !== +rc.dataset.rmconv) }, t("hist.convDesligada")); renderDrawer(true); return; }
  const rm = e.target.closest("[data-rmlink]"); if (rm) { patchTask(tk.id, { links: (tk.links || []).filter((_, i) => i !== +rm.dataset.rmlink) }); renderDrawer(true); return; }
  const ur = e.target.closest("[data-unrel]"); if (ur) { unlinkRelated(tk.id, ur.dataset.unrel); renderDrawer(true); return; }
  if (e.target.id === "unPai") { const p = byId(tk.pai); patchTask(tk.id, { pai: null }, t("hist.deixouSub", { t: p ? p.titulo : tk.pai })); renderDrawer(true); return; }
  if (e.target.id === "delAsk") { ui.confirmDel = true; renderDrawer(true); }
  if (e.target.id === "delNo") { ui.confirmDel = false; renderDrawer(true); }
  if (e.target.id === "delYes") deleteTask(tk.id);
});
host.addEventListener("change", e => {
  const tk = byId(ui.openId); if (!tk) return;
  const v = e.target.value;
  switch (e.target.id) {
    case "dTitulo": if (v.trim() && v.trim() !== tk.titulo) patchTask(tk.id, { titulo: v.trim() }); break;
    case "dStatus": v === "descartada" ? setStatus(tk.id, "feito", "descartada") : setStatus(tk.id, v); break;
    case "dPrio": patchTask(tk.id, { prioridade: v }); break;
    case "dProjeto": { const l = projList(v); if (l.join("|") !== projetosOf(tk).join("|")) patchTask(tk.id, Object.assign(projPatch(l), { tags: syncProjetoTag(tk.tags, l) })); break; }
    case "dArea": patchTask(tk.id, { area: v }); break;
    case "dPrazo": patchTask(tk.id, { prazo: v || null }, v ? t("hist.prazo", { d: fmtData(v) }) : t("hist.prazoRem")); break;
    case "dTags": { const novas = [...new Set(v.split(",").map(normTag).filter(Boolean))]; patchTask(tk.id, { tags: syncProjetoTag(novas, projetosOf(tk)) }); break; }
    case "dProx": if (v.trim() !== (tk.proximo_passo || "")) patchTask(tk.id, { proximo_passo: v.trim() }); break;
    case "dCtx": if (v !== (tk.contexto || "")) patchTask(tk.id, { contexto: v }); break;
  }
});
host.addEventListener("submit", e => {
  e.preventDefault();
  const tk = byId(ui.openId); if (!tk) return;
  if (e.target.id === "linkForm") {
    const url = $("#lUrl").value.trim(); if (!/^https?:\/\//.test(url)) { toast(t("toast.httpsOnly")); return; }
    patchTask(tk.id, { links: [...(tk.links || []), { rotulo: $("#lRot").value.trim(), url }] }); renderDrawer(true);
  }
  if (e.target.id === "convForm") {
    const c = parseConv($("#cLink").value.trim());
    if (!c) { toast(t("toast.convInvalida")); return; }
    if ((tk.conversas || []).some(x => x.id === c.id)) { toast(t("toast.convJa")); return; }
    const novo = Object.assign({ id: c.id, titulo: $("#cTit").value.trim() || c.id, link: c.link }, c.retomar ? { retomar: c.retomar } : {}, { arquivada: false });
    patchTask(tk.id, { conversas: [...(tk.conversas || []), novo], chaves: [...new Set([...(tk.chaves || []), "conversa:" + c.id])] }, t("hist.convLigada", { t: novo.titulo })); renderDrawer(true);
  }
  if (e.target.id === "relForm") {
    const alvo = $("#rAlvo").value, tipo = $("#rTipo").value; if (!alvo) return;
    if (tipo === "pai") {
      if (wouldCycle(tk.id, alvo)) { toast(t("toast.ciclo")); return; }
      patchTask(tk.id, { pai: alvo }, t("hist.virouSub", { t: byId(alvo).titulo }));
    } else linkRelated(tk.id, alvo);
    renderDrawer(true);
  }
  if (e.target.id === "noteForm") { const n = $("#nTxt").value.trim(); if (n) { patchTask(tk.id, {}, n); renderDrawer(true); $("#nTxt")?.focus(); } }
});
host.addEventListener("keydown", e => { if (e.target.id === "dTitulo" && e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.openId) { ui.openId = null; renderDrawer(true); }
  if (e.key === "/" && !ui.openId && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) { e.preventDefault(); $("#q").focus(); }
});

// ===== Boot =====
// O diário do dia (dias/<hoje>) depende do fuso e do relógio: assina de novo quando as preferências mudam o "hoje"
// e quando o dia vira com a página aberta (conferido a cada minuto e ao voltar para a aba).
let diaUnsub = null;
function subDia() {
  const k = todayStr(); if (!db || k === hojeKey) return;
  try { if (typeof diaUnsub === "function") diaUnsub(); } catch (e) {}
  hojeKey = k; hoje = null; renderToday(); // o plano de ontem sai da tela até o de hoje chegar
  diaUnsub = db.doc("dias/" + k).onSnapshot(s => { if (k !== hojeKey) return; hoje = s.exists ? s.data() : null; renderToday(); }, () => {});
}
setInterval(subDia, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) subDia(); });
render();
(async () => {
  try { db = window.CORTEX_LOCAL ? await window.cortexLocal.ready() : (window.claude ? await window.claude.use("db") : null); } catch (e) { db = null; }
  if (!db) { loaded = true; canWrite = false; setSync("off", "sync.indisp"); banner(window.CORTEX_LOCAL ? "banner.semLocal" : "banner.semDb"); render(); return; }
  try {
    const user = !db.local && window.claude ? await window.claude.use("user") : null;
    const w = user ? await user.can("data.write") : null;
    if (w === false) { canWrite = false; banner("banner.leitura"); }
  } catch (e) {}
  db.doc("config/preferencias").onSnapshot(s => {
    const first = !prefsLoaded; prefsLoaded = true;
    if (s.exists) {
      const p = s.data() || {};
      setLocale(p);
      ESCOPO = Object.assign({}, ESCOPO, {
        nome: p.nome || ESCOPO.nome, sub: p.sub || "", areas: (p.areas && p.areas.length) ? p.areas : ESCOPO.areas, area_padrao: p.area_padrao || "",
        parada_dias: p.parada_dias || 14, zumbi_dias: p.zumbi_dias || 60, exemploProjeto: p.exemplo_projeto || ESCOPO.exemploProjeto,
      });
    }
    subDia(); render(); if (first) materializar();
  }, () => { if (!prefsLoaded) { prefsLoaded = true; materializar(); } });
  db.doc("indice/ativos").onSnapshot(s => { indiceIds = new Set(s.exists ? Object.keys(s.data().itens || {}) : []); }, () => {});
  subDia();
  db.collection("recorrentes").onSnapshot(snap => {
    recs = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); const first = !recLoaded; recLoaded = true;
    if (ui.view === "recorrentes") render(); if (first) materializar();
  }, () => { recLoaded = true; });
  col().onSnapshot(snap => {
    tasks = snap.docs.map(d => { const x = Object.assign({ id: d.id }, d.data()); x.status = stId(x.status); if (!PRIO_ORD.hasOwnProperty(x.prioridade)) x.prioridade = "media"; return x; });
    const first = !loaded; loaded = true; setSync("ok", "sync.ok", { n: tasks.length }); render(); if (first) materializar();
  }, err => { setSync("off", "sync.parou"); banner("banner.caiu", { code: err && err.code }); });
})();
</script>
