<style>
/* ===== v1: tags, ligações, plano do dia ===== */
.tagchip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: transparent; white-space: nowrap; cursor: pointer; }
.tagchip:hover, .tagchip.on { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.tagchip.pessoa::before { content: "@"; opacity: .6; }
.parent { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.chip.auto { background: transparent; border: 1px dotted var(--muted); }
.chip.desc { background: var(--surface-2); color: var(--muted); text-decoration: line-through; }
.today { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px 24px; }
.today h2 { margin: 0 0 6px; font-family: var(--f-display); font-size: 15px; font-weight: 600; }
.today ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.today li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; min-width: 0; }
.today li span { overflow-wrap: anywhere; min-width: 0; }
.today li.done span { color: var(--muted); text-decoration: line-through; }
.today input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); }
.today .hora { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 42px; }
[hidden] { display: none !important; }
.linkt, .today .linkt { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); }
.rel-list { display: flex; flex-direction: column; gap: 6px; }
.rel-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.rel-row button.go { border: 0; background: transparent; color: var(--fg); text-align: left; padding: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
.rel-row .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; flex: none; }
.rel-add { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; }
/* ===== recorrentes ===== */
.chip.rec { background: var(--info-soft); color: var(--info); }
.recs { display: flex; flex-direction: column; gap: 12px; }
.rec-form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; align-items: end; }
.rec-form .wide { grid-column: span 2; }
.rec-form .full { grid-column: 1 / -1; }
.rec-form h2 { grid-column: 1 / -1; margin: 0; font-family: var(--f-display); font-size: 15px; font-weight: 600; }
.dows { display: flex; flex-wrap: wrap; gap: 4px; }
.dows label { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; display: flex; gap: 4px; align-items: center; }
.rec-row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.rec-row.off { opacity: .6; }
.rec-row .t { font-weight: 600; flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
.rec-row .r { font-size: 12.5px; color: var(--muted); }
.togglebtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
@media (max-width: 640px) { .today { grid-template-columns: 1fr; } .rel-add { grid-template-columns: 1fr; } .rec-form { grid-template-columns: 1fr 1fr; } }
</style>

<script>
// Quadro de tarefas v1. Contrato de dados: <skills>/tarefas/SCHEMA.md
// O escopo (nome, áreas, prazos de "parada") vem de config/preferencias no banco.
let ESCOPO = { nome: "", sub: "", areas: [{ id: "geral", nome: "Geral" }], parada_dias: 14, zumbi_dias: 60, exemploProjeto: "Projeto" };

const STATUS = [
  { id: "entrada", nome: "Entrada" }, { id: "a_fazer", nome: "A fazer" }, { id: "fazendo", nome: "Fazendo" },
  { id: "esperando", nome: "Esperando" }, { id: "feito", nome: "Feito" },
];
const STATUS_NOME = Object.fromEntries(STATUS.map(s => [s.id, s.nome]));
const stId = s => (s in STATUS_NOME ? s : "entrada");
const PRIO_ORD = { alta: 0, media: 1, baixa: 2 };
const DIA = 86400000;
const HIST_MAX = 50;

let db = null, canWrite = true;
let tasks = [], hoje = null, loaded = false;
const ui = { view: "quadro", q: "", projeto: "", tag: "", area: "", openId: null, confirmDel: false, showRec: true, recEdit: null };
try { Object.assign(ui, JSON.parse(localStorage.getItem("tarefas-ui") || "{}"), { openId: null, confirmDel: false, q: "", recEdit: null }); } catch (e) {}
function persistUi() { try { localStorage.setItem("tarefas-ui", JSON.stringify({ view: ui.view, projeto: ui.projeto, tag: ui.tag, area: ui.area, showRec: ui.showRec })); } catch (e) {} }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowIso = () => new Date().toISOString();
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const areaNome = id => (ESCOPO.areas.find(a => a.id === id) || {}).nome || id;
const byId = id => tasks.find(t => t.id === id);
function ddmm(iso) { if (!iso) return ""; const [y, m, d] = iso.slice(0, 10).split("-"); return d + "/" + m + (y !== String(new Date().getFullYear()) ? "/" + y.slice(2) : ""); }
function ddmmhh(iso) { if (!iso) return ""; const d = new Date(iso); return ddmm(iso.slice(0, 10)) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function daysSince(iso) { return iso ? Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / DIA)) : 0; }
function slug(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim().replace(/[^a-z0-9:]+/g, "-").replace(/^-+|-+$/g, ""); }
function normTag(raw) { let t = slug(raw); if (!t) return ""; if (!t.includes(":")) t = "tema:" + t; const [k, ...v] = t.split(":"); return k + ":" + v.join("-").replace(/^-+/, ""); }
function tagLabel(t) { const i = t.indexOf(":"); return i < 0 ? t : t.slice(i + 1); }
function projList(v) { const vistos = new Set(), out = []; (Array.isArray(v) ? v : String(v || "").split(",")).forEach(x => { x = String(x).trim(); const s = slug(x); if (x && s && !vistos.has(s)) { vistos.add(s); out.push(x); } }); return out; }
function nomeProjeto(s) { const o = tasks.find(x => x.projeto && slug(x.projeto) === s); return o ? o.projeto : s.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" "); }
// v3: lista em `projetos`; card v2 (sem a lista) = `projeto` + os outros que estão só nas tags `projeto:`
function projetosOf(t) { if (Array.isArray(t.projetos)) { const l = projList(t.projetos); if (l.length) return l; } const base = projList(t.projeto ? [t.projeto] : []); if (Array.isArray(t.projetos)) return base; const extra = (t.tags || []).filter(x => x.startsWith("projeto:")).map(x => x.slice(8)).filter(s => s && !base.some(p => slug(p) === s)).map(nomeProjeto); return projList(base.concat(extra)); }
function projPatch(lista) { return { projetos: lista, projeto: lista[0] || "" }; }
function syncProjetoTag(tags, projetos) { const rest = (tags || []).filter(t => !t.startsWith("projeto:")); return [...new Set(projList(projetos).map(p => "projeto:" + slug(p)))].concat(rest); }

function prazoInfo(t) {
  if (!t.prazo || t.status === "feito") return null;
  const diff = Math.round((new Date(t.prazo + "T12:00:00") - new Date(todayStr() + "T12:00:00")) / DIA);
  if (diff < 0) return { cls: "late", txt: "atrasada " + (-diff) + "d" };
  if (diff === 0) return { cls: "late", txt: "vence hoje" };
  if (diff <= 3) return { cls: "soon", txt: "vence " + ddmm(t.prazo) };
  return { cls: "", txt: "prazo " + ddmm(t.prazo) };
}
function staleInfo(t) {
  if (t.status === "feito") return null;
  const d = daysSince(t.atualizado_em || t.criado_em);
  if (d >= (ESCOPO.zumbi_dias || 60)) return { cls: "zombie", txt: "parada há " + d + "d" };
  if (d >= (ESCOPO.parada_dias || 14)) return { cls: "stale", txt: "parada há " + d + "d" };
  return null;
}
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2800); }
function setSync(state, text) { $("#sync").className = "sync " + state; $("#syncText").textContent = text; }
function banner(msg) { const b = $("#banner"); b.hidden = !msg; b.textContent = msg || ""; }

// ===== Conversas (links claude://) =====
const convLink = c => c.link || ("claude://claude.ai/epitaxy/" + c.id);
function mainConv(t) { const cs = t.conversas || []; return cs.find(c => !c.arquivada) || cs[0] || null; }
function convBtn(c, label) { return `<a class="conv ${c.arquivada ? "arch" : ""}" href="${esc(convLink(c))}" target="_blank" rel="noopener" data-conv="${esc(convLink(c))}" title="${esc(c.titulo || "")}">${label || (c.arquivada ? "Conversa arquivada ↗" : "Abrir conversa ↗")}</a>`; }
async function copyText(txt) { try { await navigator.clipboard.writeText(txt); toast("Link copiado"); } catch (e) { toast("Não deu para copiar. Selecione o link e copie."); } }

// ===== Escritas: uma por vez por documento =====
const chains = {};
function queue(key, fn) {
  const run = (chains[key] || Promise.resolve()).then(fn).catch(e => {
    if (e && e.code === "invalid_argument" && canWrite && key !== "indice") { canWrite = false; render(); toast("Sem permissão para editar. A página ficou só leitura."); }
    else if (e && e.code === "quota_exceeded") toast("O banco está cheio. Arquive ou apague tarefas antigas.");
    else if (key !== "indice") toast("Não salvou: " + (e && e.message || "erro desconhecido"));
    else setSync("off", "Índice não atualizou (o boa noite reconcilia)");
    return false;
  });
  chains[key] = run; return run;
}
const col = () => db.collection("tasks");
function indexEntry(t) { return { t: t.titulo, s: t.status, p: projetosOf(t)[0] || "", ps: projetosOf(t), tags: t.tags || [], k: t.chaves || [], pai: t.pai || null, u: t.atualizado_em }; }
function touchIndex(entries, after) {
  if (!db) return;
  const ref = db.doc("indice/ativos");
  const body = { itens: entries, atualizado_em: nowIso() };
  queue("indice", async () => {
    if (after) { const ok = await after; if (ok === false) return; }
    try { await ref.update(body); }
    catch (e) { if (e && e.code === "invalid_argument") { const s = await ref.get(); if (!s.exists) await ref.set(body); else throw e; } else throw e; }
  });
}
function patchTask(id, patch, nota) {
  if (!db || !canWrite) return;
  const t = byId(id); if (!t) return;
  const body = Object.assign({}, patch, { atualizado_em: nowIso() });
  if (nota) body.historico = [{ em: body.atualizado_em, texto: nota, por: "pagina" }, ...(t.historico || [])].slice(0, HIST_MAX);
  Object.assign(t, body);
  const w = queue(id, () => col().doc(id).update(body).then(() => true));
  touchIndex({ [id]: indexEntry(t) }, w);
  render();
}
function setStatus(id, status, resolucao) {
  const t = byId(id); if (!t) return;
  const res = status === "feito" ? (resolucao || "concluida") : null;
  if (t.status === status && (t.resolucao || null) === res) return;
  const de = t.status === "feito" && t.resolucao === "descartada" ? "Descartada" : STATUS_NOME[t.status];
  const para = res === "descartada" ? "Descartada" : STATUS_NOME[status];
  patchTask(id, { status, resolucao: res, concluido_em: status === "feito" ? nowIso() : null }, "Status: " + de + " → " + para);
}
function parseQuick(text) {
  const t = { projetos: [], prioridade: "media", area: ESCOPO.areas[0].id, prazo: null, tags: [] };
  let titulo = text.replace(/#([\p{L}\p{N}_.-]+)/gu, (_, p) => { t.projetos.push(p); return ""; })
    .replace(/!(alta|media|média|baixa)\b/giu, (_, p) => { t.prioridade = p.toLowerCase().replace("é", "e"); return ""; })
    .replace(/@([\p{L}\p{N}_-]+)/gu, (m, a) => { const k = a.toLowerCase(); if (ESCOPO.areas.some(x => x.id === k)) { t.area = k; } else { t.tags.push("pessoa:" + slug(a)); } return ""; })
    .replace(/\+([\p{L}\p{N}_:-]+)/gu, (_, g) => { const n = normTag(g); if (n) t.tags.push(n); return ""; })
    .replace(/\^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/g, (_, d, m, y) => {
      const yy = y ? (y.length === 2 ? "20" + y : y) : String(new Date().getFullYear());
      t.prazo = yy + "-" + m.padStart(2, "0") + "-" + d.padStart(2, "0"); return "";
    }).replace(/\s+/g, " ").trim();
  t.projetos = projList(t.projetos); t.projeto = t.projetos[0] || "";
  t.tags = syncProjetoTag([...new Set(t.tags)], t.projetos);
  return Object.assign(t, { titulo });
}
let indiceIds = new Set();
function newId(titulo) { let base = slug(titulo).replace(/:/g, "-").slice(0, 40).replace(/-+$/, "") || "tarefa"; let id = base, n = 2; while (byId(id) || indiceIds.has(id)) id = base + "-" + n++; return id; }
async function addTask(text) {
  if (!db || !canWrite) { toast("O banco não está disponível nesta visualização."); return; }
  const p = parseQuick(text); if (!p.titulo) return;
  const now = nowIso(), id = newId(p.titulo);
  const body = {
    titulo: p.titulo, status: "entrada", resolucao: null, prioridade: p.prioridade, area: p.area, projeto: p.projeto, projetos: p.projetos,
    tags: p.tags, chaves: [], pai: null, relacionadas: [], prazo: p.prazo, proximo_passo: "", contexto: "", resumo: "",
    links: [], conversas: [], historico: [{ em: now, texto: "Criada no quadro", por: "pagina" }],
    fonte: { tipo: "manual", ref: "" }, auto: false, criado_em: now, atualizado_em: now, concluido_em: null,
  };
  tasks.push(Object.assign({ id }, body)); render();
  const w = queue(id, async () => {
    const s = await col().doc(id).get();
    if (s.exists) throw { code: "conflito", message: "já existe uma tarefa com o id " + id + "; recarregue e tente de novo" };
    await col().doc(id).set(body); return true;
  });
  touchIndex({ [id]: indexEntry(Object.assign({ id }, body)) }, w);
}
function deleteTask(id) {
  if (!db || !canWrite) return;
  const t = byId(id); if (!t) return;
  // desfaz ligações que apontam para ela
  tasks.filter(x => x.pai === id).forEach(x => patchTask(x.id, { pai: null }, "Tarefa-mãe apagada: " + t.titulo));
  tasks.filter(x => (x.relacionadas || []).includes(id)).forEach(x => patchTask(x.id, { relacionadas: x.relacionadas.filter(r => r !== id) }, "Ligação removida: " + t.titulo + " foi apagada"));
  tasks = tasks.filter(x => x.id !== id); ui.openId = null; ui.confirmDel = false; render();
  const w = queue(id, () => col().doc(id).delete().then(() => true));
  touchIndex({ [id]: { s: "apagada", u: nowIso() } }, w);
  toast("Tarefa apagada");
}
function linkRelated(a, b) {
  const ta = byId(a), tb = byId(b); if (!ta || !tb || a === b) return;
  if (!(ta.relacionadas || []).includes(b)) patchTask(a, { relacionadas: [...(ta.relacionadas || []), b] }, "Ligada a: " + tb.titulo);
  if (!(tb.relacionadas || []).includes(a)) patchTask(b, { relacionadas: [...(tb.relacionadas || []), a] }, "Ligada a: " + ta.titulo);
}
function unlinkRelated(a, b) {
  const ta = byId(a), tb = byId(b);
  if (ta) patchTask(a, { relacionadas: (ta.relacionadas || []).filter(x => x !== b) }, "Ligação removida: " + (tb ? tb.titulo : b));
  if (tb) patchTask(b, { relacionadas: (tb.relacionadas || []).filter(x => x !== a) }, "Ligação removida: " + (ta ? ta.titulo : a));
}
// ===== Recorrentes (coleção recorrentes; regra igual à de <skills>/tarefas/recorrentes.py) =====
let recs = [], recLoaded = false;
const DOW = ["", "seg", "ter", "qua", "qui", "sex", "sáb", "dom"];
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const isoDow = s => { const g = new Date(s + "T12:00:00").getDay(); return g === 0 ? 7 : g; };
const dayDiff = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / DIA);
function recInicio(r) { return (r.regra && r.regra.inicio) || (r.criado_em || "").slice(0, 10) || todayStr(); }
function recMatch(r, s) {
  const g = r.regra || {}, ini = recInicio(r), n = Math.max(1, +g.a_cada || 1);
  if (s < ini) return false;
  if (g.tipo === "diaria") return dayDiff(ini, s) % n === 0;
  if (g.tipo === "semanal") {
    const dias = (g.dias && g.dias.length) ? g.dias : [isoDow(ini)];
    if (!dias.includes(isoDow(s))) return false;
    return Math.round(dayDiff(addDays(ini, 1 - isoDow(ini)), addDays(s, 1 - isoDow(s))) / 7) % n === 0;
  }
  if (g.tipo === "mensal") {
    const [y, m, d] = s.split("-").map(Number), [yi, mi] = ini.split("-").map(Number);
    if (((y - yi) * 12 + (m - mi)) % n !== 0) return false;
    const ult = new Date(y, m, 0).getDate(), alvo = +g.dia === -1 ? ult : Math.min(+g.dia || +ini.slice(8), ult);
    return d === alvo;
  }
  return false;
}
function recNext(r, from) { let s = from > recInicio(r) ? from : recInicio(r); for (let i = 0; i < 800; i++, s = addDays(s, 1)) if (recMatch(r, s)) return s; return null; }
function recRegraTxt(r) {
  const g = r.regra || {}, n = Math.max(1, +g.a_cada || 1);
  if (g.tipo === "diaria") return n === 1 ? "todo dia" : "a cada " + n + " dias";
  if (g.tipo === "semanal") return (n === 1 ? "toda semana" : "a cada " + n + " semanas") + " · " + ((g.dias && g.dias.length) ? g.dias : [isoDow(recInicio(r))]).map(d => DOW[d]).join(", ");
  if (g.tipo === "mensal") return (n === 1 ? "todo mês" : "a cada " + n + " meses") + " · dia " + (+g.dia === -1 ? "último" : (g.dia || +recInicio(r).slice(8)));
  return "regra inválida";
}
const recTaskId = (rid, s) => (rid + "--" + s).slice(0, 60);
const recOpen = rid => tasks.find(t => t.recorrente === rid && t.status !== "feito");
// Gera o card da ocorrência que chegou (até hoje + antecedência). Uma aberta por recorrente: se a anterior
// ainda está aberta, não duplica, só anota nela. Ocorrências que passaram sem ninguém abrir o quadro viram "puladas".
async function materializar() {
  if (!db || !canWrite || !loaded || !recLoaded) return;
  const hojeS = todayStr();
  for (const r of recs) {
    if (r.ativo === false) continue;
    const limite = addDays(hojeS, Math.max(0, +r.antecedencia_dias || 0));
    let s = recNext(r, r.ultima ? addDays(r.ultima, 1) : recInicio(r)), alvo = null, n = 0;

  const editing = ui.recEdit && ui.recEdit !== "novo" ? recs.find(x => x.id === ui.recEdit) : null;
  const regra = { tipo, a_cada: Math.max(1, +f("a_cada").value || 1), inicio: f("inicio").value || todayStr() };

function filtered() {
  const q = slug(ui.q).replace(/-/g, " ");
  return tasks.filter(t =>
    (!ui.projeto || projetosOf(t).includes(ui.projeto)) &&
    (!ui.tag || (t.tags || []).includes(ui.tag)) &&
    (!ui.area || t.area === ui.area) &&
    (ui.showRec || !t.recorrente) &&
    (!q || slug([t.titulo, t.proximo_passo, t.contexto, t.resumo, projetosOf(t).join(" "), (t.tags || []).join(" "), (t.chaves || []).join(" ")].join(" ")).replace(/-/g, " ").includes(q)));

function sortTasks(arr) {
  return arr.slice().sort((a, b) => {
    if (a.status === "feito" && b.status === "feito") return (b.concluido_em || "").localeCompare(a.concluido_em || "");
    const pa = PRIO_ORD[a.prioridade] ?? 1, pb = PRIO_ORD[b.prioridade] ?? 1;
    if (pa !== pb) return pa - pb;
    const da = a.prazo || "9999", dbb = b.prazo || "9999";
    if (da !== dbb) return da.localeCompare(dbb);
    return (b.atualizado_em || "").localeCompare(a.atualizado_em || "");

}

  <aside class="drawer" role="dialog" aria-label="Detalhe da tarefa">
    <div class="d-head">
      <textarea id="dTitulo" rows="2" ${ro} aria-label="Título">${esc(t.titulo)}</textarea>
      <button class="icon-btn" type="button" data-close="1" aria-label="Fechar">×</button>
    </div>
    <div class="d-body">
      ${t.resumo ? `<p style="margin:0;color:var(--muted)">${esc(t.resumo)}</p>` : ""}
      <div class="grid2">
        <label class="lbl">Status<select class="field" id="dStatus" ${ro}>${STATUS.map(s => `<option value="${s.id}" ${s.id === statusVal ? "selected" : ""}>${s.nome}</option>`).join("")}<option value="descartada" ${statusVal === "descartada" ? "selected" : ""}>Descartada</option></select></label>
        <label class="lbl">Prioridade<select class="field" id="dPrio" ${ro}>${["alta", "media", "baixa"].map(p => `<option value="${p}" ${p === t.prioridade ? "selected" : ""}>${p === "media" ? "média" : p}</option>`).join("")}</select></label>
        <label class="lbl">Projetos<input class="field" id="dProjeto" list="dlProjetos" value="${esc(projetosOf(t).join(", "))}" placeholder="Site, Ferramentas" title="Um ou mais, separados por vírgula; o primeiro é o principal" ${ro}><datalist id="dlProjetos">${projetos.map(p => `<option value="${esc(p)}">`).join("")}</datalist></label>
        ${ESCOPO.areas.length > 1 ? `<label class="lbl">Área<select class="field" id="dArea" ${ro}>${ESCOPO.areas.map(a => `<option value="${esc(a.id)}" ${a.id === t.area ? "selected" : ""}>${esc(a.nome)}</option>`).join("")}</select></label>` : ""}
        <label class="lbl">Prazo<input class="field" type="date" id="dPrazo" value="${esc(t.prazo || "")}" ${ro}></label>
        <label class="lbl">Criada<span class="date" style="padding-top:8px">${ddmmhh(t.criado_em)}</span></label>
      </div>
      <label class="lbl">Tags<input class="field" id="dTags" value="${esc((t.tags || []).filter(x => !x.startsWith("projeto:")).join(", "))}" placeholder="pessoa:ana, tema:financeiro" ${ro}></label>
      <label class="lbl">Próximo passo<input class="field" id="dProx" value="${esc(t.proximo_passo)}" placeholder="A próxima ação concreta" ${ro}></label>
      <label class="lbl">Contexto<textarea class="field" id="dCtx" rows="5" placeholder="Pessoas, decisões, por que isso existe" ${ro}>${esc(t.contexto)}</textarea></label>
      <div>
        <p class="sec-title">Ligações</p>
        <div class="rel-list">
          ${t.pai ? relRow("mãe", t.pai, false) : ""}
          ${filhos.map(f => relRow("sub", f.id, false)).join("")}
          ${(t.relacionadas || []).map(r => relRow("ligada", r, !ro)).join("")}
          ${!t.pai && !filhos.length && !(t.relacionadas || []).length ? '<span class="hint">Nenhuma ligação ainda.</span>' : ""}
          ${ro ? "" : `<form class="rel-add" id="relForm">
            <select class="field" id="rTipo" aria-label="Tipo de ligação"><option value="rel">Ligar a</option><option value="pai">É subtarefa de</option></select>
            <select class="field" id="rAlvo" aria-label="Tarefa"><option value="">Escolha a tarefa…</option>${outras.map(o => `<option value="${esc(o.id)}">${esc(o.titulo)}</option>`).join("")}</select>
            <button class="btn" type="submit">Ligar</button></form>`}
          ${t.pai && !ro ? `<button type="button" class="mini" id="unPai" style="align-self:flex-start">Deixar de ser subtarefa</button>` : ""}
        </div>
      </div>
      <div>
        <p class="sec-title">Conversas no Claude</p>
        <div class="links">
          ${(t.conversas || []).map((c, i) => `<div class="conv-row">
            <span class="ct">${esc(c.titulo || c.id)}${c.arquivada ? ' <span class="chip">arquivada</span>' : ""}<small>${esc(convLink(c))}</small></span>
            ${convBtn(c, "Abrir ↗")}
            <button type="button" class="mini" data-copyconv="${i}">Copiar link</button>
            ${ro ? "" : `<button type="button" class="mini" data-rmconv="${i}">remover</button>`}
          </div>`).join("") || '<span class="hint">Nenhuma conversa ligada a esta tarefa.</span>'}
          ${ro ? "" : `<form class="conv-add" id="convForm"><input class="field" id="cLink" placeholder="Link ou id da conversa (claude://… ou local_…)" required><input class="field" id="cTit" placeholder="Título (opcional)"><button class="btn" type="submit">Ligar</button></form>`}
        </div>
      </div>
      <div>
        <p class="sec-title">Links e evidências</p>
        <div class="links">
          ${(t.links || []).map((l, i) => `<div class="link-row"><a href="${esc(/^https?:\/\//.test(l.url) ? l.url : "#")}" target="_blank" rel="noopener">${esc(l.rotulo || l.url)}</a>${ro ? "" : `<button type="button" data-rmlink="${i}">remover</button>`}</div>`).join("") || '<span class="hint">Nenhum link ainda.</span>'}
          ${ro ? "" : `<form class="link-add" id="linkForm"><input class="field" id="lRot" placeholder="Rótulo (ex.: PR #356)"><input class="field" id="lUrl" type="url" placeholder="https://…" required><button class="btn" type="submit">Adicionar</button></form>`}
        </div>
      </div>
      <div>
        <p class="sec-title">Histórico</p>
        ${ro ? "" : `<form class="note-add" id="noteForm" style="margin-bottom:10px"><input class="field" id="nTxt" placeholder="Anotar o que andou"><button class="btn" type="submit">Anotar</button></form>`}
        <ul class="timeline">${(t.historico || []).map(h => `<li><span class="date">${ddmmhh(h.em)}${h.por && h.por !== "pagina" ? " · " + esc(h.por) : ""}</span>${esc(h.texto)}</li>`).join("")}</ul>
      </div>
      <div class="d-foot">
        <span class="src">Origem: ${esc(t.fonte?.tipo || "manual")}${t.fonte?.ref ? " · " + esc(t.fonte.ref) : ""}${(t.chaves || []).length ? " · " + t.chaves.map(esc).join(", ") : ""}</span>
        ${ro ? "" : ui.confirmDel
          ? `<span style="display:flex;gap:6px;align-items:center"><span class="hint">Apagar de vez?</span><button class="btn danger" type="button" id="delYes">Apagar</button><button class="btn" type="button" id="delNo">Cancelar</button></span>`
          : `<button class="btn danger" type="button" id="delAsk">Apagar tarefa</button>`}
      </div>
    </div>
  </aside>`;
}
function render() { renderControls(); renderToday(); renderSummary(); if (!(ui.view === "recorrentes" && ui.recEdit && $("#recForm"))) renderMain(); renderDrawer(); }

// ===== Eventos =====
$("#quickForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#quickInput").value; $("#quickInput").value = ""; addTask(v); });
let qTimer; $("#q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { ui.q = e.target.value; renderMain(); }, 120); });
$("#fProjeto").addEventListener("change", e => { ui.projeto = e.target.value; persistUi(); render(); });
$("#fTag").addEventListener("change", e => { ui.tag = e.target.value; persistUi(); render(); });
$("#fArea").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; ui.area = b.dataset.a; persistUi(); render(); });
$("#fRec").addEventListener("click", () => { ui.showRec = !ui.showRec; persistUi(); render(); });
$("#fView").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; ui.view = b.dataset.v; persistUi(); render(); });
function openTask(id) { ui.openId = id; ui.confirmDel = false; renderDrawer(true); setTimeout(() => $("#dTitulo")?.focus(), 0); }

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-conv]"); if (!a) return;
  const link = a.dataset.conv; let left = false;
  const onBlur = () => { left = true; };
  window.addEventListener("blur", onBlur, { once: true });
  setTimeout(() => {
    window.removeEventListener("blur", onBlur);
    if (!left && document.visibilityState === "visible") navigator.clipboard?.writeText(link).then(
      () => toast("O app não abriu daqui. Copiei o link: cole na barra do navegador."),
      () => toast("O app não abriu daqui. Use Copiar link na tarefa."));
  }, 1500);
}, true);
function chipFilter(e) { const g = e.target.closest("[data-tag]"); if (!g) return false; e.stopPropagation(); ui.tag = ui.tag === g.dataset.tag ? "" : g.dataset.tag; persistUi(); render(); return true; }
$("#main").addEventListener("click", e => {
  if (ui.view !== "recorrentes") return;
  const op = e.target.closest("[data-open]"); if (op) { openTask(op.dataset.open); return; }
  if (e.target.id === "recNew") { ui.recEdit = "novo"; renderMain(); return; }
  if (e.target.id === "recCancel") { ui.recEdit = null; renderMain(); return; }
  const ed = e.target.closest("[data-recedit]"); if (ed) { ui.recEdit = ed.dataset.recedit; renderMain(); return; }
  const pa = e.target.closest("[data-recpausa]");
  if (pa) { const r = recs.find(x => x.id === pa.dataset.recpausa); if (!r) return; const ativo = r.ativo === false;
    // retomar não gera o que passou durante a pausa
    const body = ativo ? { ativo, ultima: addDays(todayStr(), -1), atualizado_em: nowIso() } : { ativo, atualizado_em: nowIso() };
    Object.assign(r, body); queue("rec:" + r.id, () => db.doc("recorrentes/" + r.id).update(body).then(() => true)); renderMain(); if (ativo) setTimeout(materializar, 300); return; }
  const dl = e.target.closest("[data-recdel]");
  if (dl) { const id = dl.dataset.recdel; if (dl.dataset.confirm !== "1") { dl.dataset.confirm = "1"; dl.textContent = "confirmar"; return; }
    recs = recs.filter(x => x.id !== id); queue("rec:" + id, () => db.doc("recorrentes/" + id).delete().then(() => true)); renderMain(); toast("Recorrente apagada (os cards que ela já gerou ficam)"); }
}, true);
$("#main").addEventListener("change", e => { if (e.target.name === "tipo") syncRecForm(); });
$("#main").addEventListener("submit", e => { if (e.target.id === "recForm") { e.preventDefault(); saveRec(e.target); } });
$("#main").addEventListener("click", e => { if (ui.view === "recorrentes") return; if (e.target.closest("a")) return; if (chipFilter(e)) return; const el = e.target.closest("[data-id]"); if (el) openTask(el.dataset.id); });
$("#main").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !e.target.closest("a")) { const el = e.target.closest("[data-id]"); if (el && e.target === el) { e.preventDefault(); openTask(el.dataset.id); } } });
$("#today").addEventListener("click", e => { const o = e.target.closest("[data-open]"); if (o) openTask(o.dataset.open); });
$("#today").addEventListener("change", e => {
  const i = e.target.dataset.plano; if (i == null || !db || !hoje) return;
  const plano = (hoje.bom_dia.plano || []).map((p, k) => k === +i ? Object.assign({}, p, { feito: e.target.checked }) : p);
  hoje = Object.assign({}, hoje, { bom_dia: Object.assign({}, hoje.bom_dia, { plano }) }); renderToday();
  queue("dia", () => db.doc("dias/" + todayStr()).update({ bom_dia: { plano } }));
});

let dragId = null;
$("#main").addEventListener("dragstart", e => { const c = e.target.closest(".card"); if (!c) return; dragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch (_) {} });
$("#main").addEventListener("dragend", e => { e.target.closest?.(".card")?.classList.remove("dragging"); document.querySelectorAll(".col.drop").forEach(c => c.classList.remove("drop")); });
$("#main").addEventListener("dragover", e => { const c = e.target.closest(".col"); if (!c || !dragId) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach(x => x !== c && x.classList.remove("drop")); c.classList.add("drop"); });
$("#main").addEventListener("drop", e => { const c = e.target.closest(".col"); if (!c || !dragId) return; e.preventDefault(); c.classList.remove("drop"); setStatus(dragId, c.dataset.status); dragId = null; });

const host = $("#drawerHost");
host.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { ui.openId = null; renderDrawer(true); return; }
  const t = byId(ui.openId); if (!t) return;
  const go = e.target.closest("[data-open]"); if (go) { openTask(go.dataset.open); return; }
  const cp = e.target.closest("[data-copyconv]"); if (cp) { const c = (t.conversas || [])[+cp.dataset.copyconv]; if (c) copyText(convLink(c)); return; }
  const rc = e.target.closest("[data-rmconv]"); if (rc) { patchTask(t.id, { conversas: (t.conversas || []).filter((_, i) => i !== +rc.dataset.rmconv) }, "Conversa desligada"); renderDrawer(true); return; }
  const rm = e.target.closest("[data-rmlink]"); if (rm) { patchTask(t.id, { links: (t.links || []).filter((_, i) => i !== +rm.dataset.rmlink) }); renderDrawer(true); return; }
  const ur = e.target.closest("[data-unrel]"); if (ur) { unlinkRelated(t.id, ur.dataset.unrel); renderDrawer(true); return; }
  if (e.target.id === "unPai") { const p = byId(t.pai); patchTask(t.id, { pai: null }, "Deixou de ser subtarefa de " + (p ? p.titulo : t.pai)); renderDrawer(true); return; }
  if (e.target.id === "delAsk") { ui.confirmDel = true; renderDrawer(true); }
  if (e.target.id === "delNo") { ui.confirmDel = false; renderDrawer(true); }
  if (e.target.id === "delYes") deleteTask(t.id);
});
host.addEventListener("change", e => {
  const t = byId(ui.openId); if (!t) return;
  const v = e.target.value;
  switch (e.target.id) {
    case "dTitulo": if (v.trim() && v.trim() !== t.titulo) patchTask(t.id, { titulo: v.trim() }); break;
    case "dStatus": v === "descartada" ? setStatus(t.id, "feito", "descartada") : setStatus(t.id, v); break;
    case "dPrio": patchTask(t.id, { prioridade: v }); break;
    case "dProjeto": { const l = projList(v); if (l.join("|") !== projetosOf(t).join("|")) patchTask(t.id, Object.assign(projPatch(l), { tags: syncProjetoTag(t.tags, l) })); break; }
    case "dArea": patchTask(t.id, { area: v }); break;
    case "dPrazo": patchTask(t.id, { prazo: v || null }, v ? "Prazo: " + ddmm(v) : "Prazo removido"); break;
    case "dTags": { const novas = [...new Set(v.split(",").map(normTag).filter(Boolean))]; patchTask(t.id, { tags: syncProjetoTag(novas, projetosOf(t)) }); break; }
    case "dProx": if (v.trim() !== (t.proximo_passo || "")) patchTask(t.id, { proximo_passo: v.trim() }); break;
    case "dCtx": if (v !== (t.contexto || "")) patchTask(t.id, { contexto: v }); break;
  }
});
host.addEventListener("submit", e => {
  e.preventDefault();
  const t = byId(ui.openId); if (!t) return;
  if (e.target.id === "linkForm") {
    const url = $("#lUrl").value.trim(); if (!/^https?:\/\//.test(url)) { toast("Use um link que comece com https://"); return; }
    patchTask(t.id, { links: [...(t.links || []), { rotulo: $("#lRot").value.trim(), url }] }); renderDrawer(true);
  }
  if (e.target.id === "convForm") {
    const raw = $("#cLink").value.trim(), m = raw.match(/local_[A-Za-z0-9-]{8,}/);
    if (!m) { toast("Cole o link da conversa (claude://claude.ai/epitaxy/…) ou o id local_…"); return; }
    if ((t.conversas || []).some(c => c.id === m[0])) { toast("Essa conversa já está ligada"); return; }
    const novo = { id: m[0], titulo: $("#cTit").value.trim() || m[0], link: "claude://claude.ai/epitaxy/" + m[0], arquivada: false };
    patchTask(t.id, { conversas: [...(t.conversas || []), novo], chaves: [...new Set([...(t.chaves || []), "conversa:" + m[0]])] }, "Conversa ligada: " + novo.titulo); renderDrawer(true);
  }
  if (e.target.id === "relForm") {
    const alvo = $("#rAlvo").value, tipo = $("#rTipo").value; if (!alvo) return;
    if (tipo === "pai") {
      if (wouldCycle(t.id, alvo)) { toast("Isso criaria um ciclo: a outra tarefa já está abaixo desta."); return; }
      patchTask(t.id, { pai: alvo }, "Virou subtarefa de " + byId(alvo).titulo);
    } else linkRelated(t.id, alvo);
    renderDrawer(true);
  }
  if (e.target.id === "noteForm") { const n = $("#nTxt").value.trim(); if (n) { patchTask(t.id, {}, n); renderDrawer(true); $("#nTxt")?.focus(); } }
});
host.addEventListener("keydown", e => { if (e.target.id === "dTitulo" && e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.openId) { ui.openId = null; renderDrawer(true); }
  if (e.key === "/" && !ui.openId && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) { e.preventDefault(); $("#q").focus(); }
});

// ===== Boot =====
render();
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { loaded = true; canWrite = false; setSync("off", "Banco indisponível"); banner("O banco deste artefato não respondeu nesta visualização. Abra a página no claude.ai para ver e editar as tarefas."); render(); return; }
  try {
    const user = window.claude ? await window.claude.use("user") : null;
    const w = user ? await user.can("data.write") : null;
    if (w === false) { canWrite = false; banner("Você tem acesso só de leitura a estas tarefas."); }
  } catch (e) {}
  db.doc("config/preferencias").onSnapshot(s => {
    if (!s.exists) return;
    const p = s.data();
    ESCOPO = Object.assign({}, ESCOPO, {
      nome: p.nome || ESCOPO.nome, sub: p.sub || "", areas: (p.areas && p.areas.length) ? p.areas : ESCOPO.areas,
      parada_dias: p.parada_dias || 14, zumbi_dias: p.zumbi_dias || 60, exemploProjeto: p.exemplo_projeto || ESCOPO.exemploProjeto,
    });
    render();
  }, () => {});
  db.doc("indice/ativos").onSnapshot(s => { indiceIds = new Set(s.exists ? Object.keys(s.data().itens || {}) : []); }, () => {});
  db.doc("dias/" + todayStr()).onSnapshot(s => { hoje = s.exists ? s.data() : null; renderToday(); }, () => {});
  db.collection("recorrentes").onSnapshot(snap => {
    recs = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); const first = !recLoaded; recLoaded = true;
    if (ui.view === "recorrentes") render(); if (first) materializar();
  }, () => { recLoaded = true; });
  col().onSnapshot(snap => {
    tasks = snap.docs.map(d => { const x = Object.assign({ id: d.id }, d.data()); x.status = stId(x.status); if (!PRIO_ORD.hasOwnProperty(x.prioridade)) x.prioridade = "media"; return x; });
    const first = !loaded; loaded = true; setSync("ok", "Sincronizado · " + tasks.length + " tarefas"); render(); if (first) materializar();
  }, err => { setSync("off", "Sincronização parou"); banner("A conexão com o banco caiu (" + err.code + "). Recarregue a página."); });
})();
</script>
